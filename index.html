<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0C567D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>我超愛喝手搖 2026</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (UMD for stability) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* iOS Input Zoom Fix */
        input, select, textarea {
            font-size: 16px !important;
        }
        
        /* Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body {
            background-color: #FDFBF7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none; /* Prevent pull-to-refresh on mobile app feel */
        }

        /* Safe Area for iPhone X+ */
        .safe-pb {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- Icons (Internal SVG) ---
        const IconBase = ({ children, color = "currentColor", size = 24, className = "", ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>{children}</svg>
        );
        
        const ChevronLeft = (p) => <IconBase {...p}><path d="m15 18-6-6 6-6"/></IconBase>;
        const ChevronRight = (p) => <IconBase {...p}><path d="m9 18 6-6-6-6"/></IconBase>;
        const Trophy = (p) => <IconBase {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></IconBase>;
        const Coffee = (p) => <IconBase {...p}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></IconBase>;
        const Trash2 = (p) => <IconBase {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconBase>;
        const CupSoda = (p) => <IconBase {...p}><path d="m7 11 2-4 6-4"/><path d="M11 11h10a4 4 0 0 1 4 4v7H7v-7a4 4 0 0 1 4-4Z"/><path d="M7 11v11"/><path d="m2 11 2-4"/></IconBase>;
        const LayoutGrid = (p) => <IconBase {...p}><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></IconBase>;
        const ChevronDown = (p) => <IconBase {...p}><path d="m6 9 6 6 6-6"/></IconBase>;
        const CheckCircle2 = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></IconBase>;
        const AlertCircle = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconBase>;

        const { useState, useEffect, useMemo } = React;
        const { createRoot } = ReactDOM;

        // Unique Storage Key
        const STORAGE_KEY = 'bubble_tea_tracker_2026_mobile_final';

        const BubbleTeaTracker = () => {
            const YEAR = 2026;
            const ICE_LEVELS = ['正常', '少冰', '微冰', '去冰', '常溫', '溫'];
            const SUGAR_LEVELS = ['全糖', '少糖', '半糖', '微糖', '一分糖', '無糖'];
            const CATEGORIES = ['純茶類', '奶茶類', '咀嚼類', '季節限定', '果茶類', '果汁類', '咖啡', '其他'];

            // --- State Initialization (Lazy Load from Storage) ---
            const [drinks, setDrinks] = useState(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    return saved ? JSON.parse(saved) : {};
                } catch (e) {
                    console.error("Storage Error:", e);
                    return {};
                }
            });

            const [currentMonth, setCurrentMonth] = useState(new Date().getMonth()); 
            const [selectedDate, setSelectedDate] = useState(null);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [showToast, setShowToast] = useState({ show: false, message: '' });
            const [isWarningOpen, setIsWarningOpen] = useState(false);

            // Form
            const [editIndex, setEditIndex] = useState(null); 
            const [formData, setFormData] = useState({
                shop: '',
                item: '',
                category: '純茶類', 
                ice: '少冰',
                sugar: '半糖',
                price: ''
            });

            // --- Auto-Save Effect ---
            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(drinks));
            }, [drinks]);

            // --- Helpers ---
            const getDaysInMonth = (month, year) => new Date(year, month + 1, 0).getDate();
            const getFirstDayOfMonth = (month, year) => new Date(year, month, 1).getDay();

            // --- Actions ---
            const handleDateClick = (dateKey) => {
                setSelectedDate(dateKey);
                setEditIndex(null);
                setFormData({ shop: '', item: '', category: '純茶類', ice: '少冰', sugar: '半糖', price: '' });
                
                const currentDayCount = (drinks[dateKey] || []).length;
                
                if (currentDayCount >= 2) {
                    setIsWarningOpen(true);
                } else {
                    setIsModalOpen(true);
                }
            };

            const proceedToModal = () => {
                setIsWarningOpen(false);
                setIsModalOpen(true);
            };

            const handleSave = () => {
                if (!formData.shop || !formData.item || !formData.price) {
                    alert("請填寫店名、品項和價格！");
                    return;
                }

                const newDrinks = { ...drinks };
                const currentDayDrinks = [...(newDrinks[selectedDate] || [])];

                if (editIndex !== null) {
                    currentDayDrinks[editIndex] = formData;
                } else {
                    currentDayDrinks.push(formData);
                }

                newDrinks[selectedDate] = currentDayDrinks;
                setDrinks(newDrinks); 
                setIsModalOpen(false);
                
                setShowToast({ show: true, message: '已完成飲料紀錄🥤' });
                setTimeout(() => setShowToast({ show: false, message: '' }), 3000);
            };

            const handleDelete = (index, e) => {
                if(e) { e.preventDefault(); e.stopPropagation(); }
                
                const newDrinks = { ...drinks };
                const currentDayDrinks = [...(newDrinks[selectedDate] || [])];
                
                currentDayDrinks.splice(index, 1);
                
                if (currentDayDrinks.length === 0) {
                    delete newDrinks[selectedDate];
                } else {
                    newDrinks[selectedDate] = currentDayDrinks;
                }
                
                setDrinks(newDrinks);
                setIsModalOpen(false);

                setShowToast({ show: true, message: '已刪除紀錄 🗑️' });
                setTimeout(() => setShowToast({ show: false, message: '' }), 3000);
            };

            const loadDrinkToEdit = (index) => {
                const drink = drinks[selectedDate][index];
                setFormData(drink);
                setEditIndex(index);
            };

            // --- Stats ---
            const stats = useMemo(() => {
                let annualSpent = 0;
                let annualCups = 0;
                let monthlySpent = 0;
                let monthlyCups = 0;
                const shopCounts = {};
                const itemCounts = {};

                Object.entries(drinks).forEach(([dateKey, dayList]) => {
                    const [y, m, d] = dateKey.split('-').map(Number);
                    dayList.forEach(d => {
                        const price = Number(d.price) || 0;
                        annualSpent += price;
                        annualCups++;
                        if (d.shop) shopCounts[d.shop] = (shopCounts[d.shop] || 0) + 1;
                        if (d.item) itemCounts[d.item] = (itemCounts[d.item] || 0) + 1;
                        if (m === currentMonth + 1) {
                            monthlySpent += price;
                            monthlyCups++;
                        }
                    });
                });

                const findMax = (obj) => {
                    let maxKey = '等待揭曉';
                    let maxVal = 0;
                    Object.entries(obj).forEach(([k, v]) => {
                        if (v > maxVal) { maxVal = v; maxKey = k; }
                    });
                    return { name: maxKey, count: maxVal };
                };

                return { 
                    annualSpent, annualCups, monthlySpent, monthlyCups, 
                    topShop: findMax(shopCounts), topItem: findMax(itemCounts) 
                };
            }, [drinks, currentMonth]);

            // --- Render ---
            const renderCalendar = () => {
                const daysInMonth = getDaysInMonth(currentMonth, YEAR);
                const firstDay = getFirstDayOfMonth(currentMonth, YEAR);
                const days = [];

                for (let i = 0; i < firstDay; i++) {
                    days.push(<div key={`empty-${i}`} className="aspect-square"></div>);
                }

                for (let day = 1; day <= daysInMonth; day++) {
                    const dateKey = `${YEAR}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const dayDrinks = drinks[dateKey] || [];
                    const totalCost = dayDrinks.reduce((acc, curr) => acc + Number(curr.price), 0);
                    
                    days.push(
                        <div key={dateKey} onClick={() => handleDateClick(dateKey)} className="flex flex-col items-center justify-start p-1 relative cursor-pointer group active:scale-95 transition-transform">
                            <div className={`w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center rounded-full text-sm font-bold shadow-sm transition-all duration-300 relative ${dayDrinks.length > 0 ? 'bg-[#EDB79C] text-[#0C567D] shadow-lg shadow-[#0C567D]/50 ring-2 ring-white/20' : 'bg-white/5 text-white/80 hover:bg-white/20 border border-white/5'}`}>
                                {day}
                                {dayDrinks.length > 0 && (
                                    <div className="absolute inset-0 flex items-center justify-center bg-[#EDB79C] rounded-full animate-in zoom-in duration-300">
                                        <span className="text-lg drop-shadow-sm">🧋</span>
                                    </div>
                                )}
                            </div>
                            {dayDrinks.length > 0 && (
                                <div className="absolute -bottom-2 bg-[#0C567D] border border-[#EDB79C] text-[#EDB79C] text-[9px] font-bold px-1.5 py-0.5 rounded-full shadow-sm z-10 scale-90">
                                    ${totalCost}
                                </div>
                            )}
                        </div>
                    );
                }
                return days;
            };

            return (
                <div className="min-h-screen bg-[#FDFBF7] font-sans text-gray-800 pb-10 flex justify-center relative safe-pb">
                    
                    {/* Toast */}
                    {showToast.show && (
                        <div className="fixed top-4 right-4 z-[100] bg-[#0C567D] text-white px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2 animate-in slide-in-from-top-5 fade-in duration-300">
                            <CheckCircle2 size={18} className="text-[#EDB79C]"/>
                            <span className="font-bold text-sm">{showToast.message}</span>
                        </div>
                    )}

                    {/* Warning Modal */}
                    {isWarningOpen && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-[#0C567D]/80 backdrop-blur-sm animate-in fade-in duration-200"></div>
                            <div className="bg-white rounded-[32px] p-6 w-full max-w-sm text-center relative z-10 animate-in zoom-in-95 duration-200 shadow-2xl border-4 border-[#EDB79C]">
                                <div className="mx-auto w-14 h-14 bg-red-100 rounded-full flex items-center justify-center mb-3 text-red-500">
                                    <AlertCircle size={32} />
                                </div>
                                <h3 className="text-xl font-black text-[#0C567D] mb-1">今天喝太多了！</h3>
                                <p className="text-gray-500 mb-5 text-sm font-bold leading-relaxed">為了健康著想，真的要再喝一杯嗎？<br/>(糖分超標啦 😱)</p>
                                <button onClick={proceedToModal} className="w-full bg-[#EDB79C] hover:bg-[#E0A080] text-[#0C567D] font-black py-3.5 rounded-[20px] shadow-lg text-base transform transition active:scale-95">好啦嗚嗚不喝了 😭</button>
                                <div className="mt-3 text-[10px] text-gray-400">*點擊按鈕將會（含淚）繼續記錄</div>
                            </div>
                        </div>
                    )}

                    <div className="w-full max-w-md bg-white min-h-screen shadow-2xl relative overflow-hidden flex flex-col">
                        
                        {/* Header */}
                        <div className="bg-[#0C567D] pb-6 pt-safe-top pt-8 px-6 rounded-b-[40px] shadow-lg z-10 relative">
                            <div className="flex justify-center items-center gap-2 mb-2">
                                <div className="p-2 bg-white/10 rounded-full text-[#EDB79C]"><CupSoda size={20}/></div>
                                <h1 className="text-xl font-black text-white tracking-widest">手搖記錄表</h1>
                            </div>
                            <p className="text-center text-[#EDB79C] text-xs font-medium tracking-widest opacity-80">2026 DAILY TRACKER</p>
                        </div>

                        {/* Content */}
                        <div className="flex-1 overflow-y-auto -mt-6 z-20 px-4 space-y-3 pb-24 pt-8">
                            
                            {/* Champions */}
                            <div className="bg-white rounded-[24px] p-4 shadow-sm border border-gray-100 flex flex-col items-center">
                                <div className="flex items-center gap-2 text-sm font-bold text-[#0C567D] mb-3">
                                    <Trophy size={16} className="text-[#EDB79C]"/> 目前暫居冠軍
                                </div>
                                <div className="flex gap-2 w-full">
                                    <div className="flex-1 bg-[#FDFBF7] rounded-[20px] p-3 flex flex-col items-center justify-center relative border border-[#EDB79C] min-h-[90px]">
                                        <span className="text-[10px] text-white font-bold bg-[#EDB79C] px-2 py-0.5 rounded-full mb-1">最愛店家</span>
                                        <div className="font-black text-[#0C567D] text-base line-clamp-1">{stats.topShop.name}</div>
                                        {stats.topShop.count > 0 && <div className="text-xs text-gray-400 mt-0.5">{stats.topShop.count} 次</div>}
                                    </div>
                                    <div className="flex-1 bg-[#FDFBF7] rounded-[20px] p-3 flex flex-col items-center justify-center relative border border-[#0C567D]/30 min-h-[90px]">
                                        <span className="text-[10px] text-white font-bold bg-[#0C567D] px-2 py-0.5 rounded-full mb-1">必點單品</span>
                                        <div className="font-black text-[#0C567D] text-base line-clamp-1">{stats.topItem.name}</div>
                                        {stats.topItem.count > 0 && <div className="text-xs text-gray-400 mt-0.5">{stats.topItem.count} 杯</div>}
                                    </div>
                                </div>
                            </div>

                            {/* Stats */}
                            <div className="grid grid-cols-2 gap-2">
                                <div className="bg-white p-3 rounded-[24px] shadow-sm border border-gray-100 space-y-2">
                                    <div className="text-[10px] font-bold text-gray-400 text-center">本月統計</div>
                                    <div className="flex justify-between items-center bg-[#EDB79C]/20 rounded-full px-2.5 py-1.5">
                                        <span className="text-[10px] text-gray-500">支出</span>
                                        <span className="font-bold text-[#0C567D] text-sm">${stats.monthlySpent}</span>
                                    </div>
                                    <div className="flex justify-between items-center bg-[#EDB79C]/20 rounded-full px-2.5 py-1.5">
                                        <span className="text-[10px] text-gray-500">杯數</span>
                                        <span className="font-bold text-[#0C567D] text-sm">{stats.monthlyCups}</span>
                                    </div>
                                </div>

                                <div className="bg-white p-3 rounded-[24px] shadow-sm border border-gray-100 space-y-2">
                                    <div className="text-[10px] font-bold text-gray-400 text-center">年度統計</div>
                                    <div className="flex justify-between items-center bg-[#0C567D]/10 rounded-full px-2.5 py-1.5">
                                        <span className="text-[10px] text-[#0C567D]">總額</span>
                                        <span className="font-bold text-[#0C567D] text-sm">${stats.annualSpent}</span>
                                    </div>
                                    <div className="flex justify-between items-center bg-[#0C567D]/10 rounded-full px-2.5 py-1.5">
                                        <span className="text-[10px] text-[#0C567D]">總杯</span>
                                        <span className="font-bold text-[#0C567D] text-sm">{stats.annualCups}</span>
                                    </div>
                                </div>
                            </div>

                            {/* Calendar */}
                            <div className="bg-[#0C567D] rounded-[30px] shadow-lg border border-[#0C567D] p-3 pb-5 relative">
                                <div className="flex items-center justify-between mb-2 px-1">
                                    <button onClick={() => setCurrentMonth(prev => Math.max(0, prev - 1))} disabled={currentMonth === 0} className="w-8 h-8 flex items-center justify-center bg-white/10 hover:bg-[#EDB79C] hover:text-[#0C567D] text-white rounded-full transition-colors disabled:opacity-30 active:scale-95"><ChevronLeft size={16}/></button>
                                    <div className="flex flex-col items-center">
                                        <h2 className="text-base font-black text-white tracking-wide">{YEAR}.{String(currentMonth + 1).padStart(2, '0')}</h2>
                                        <div className="bg-[#EDB79C] text-[#0C567D] px-2.5 py-0.5 rounded-full text-[10px] font-bold shadow-sm mt-0.5">累積支出 ${stats.monthlySpent}</div>
                                    </div>
                                    <button onClick={() => setCurrentMonth(prev => Math.min(11, prev + 1))} disabled={currentMonth === 11} className="w-8 h-8 flex items-center justify-center bg-white/10 hover:bg-[#EDB79C] hover:text-[#0C567D] text-white rounded-full transition-colors disabled:opacity-30 active:scale-95"><ChevronRight size={16}/></button>
                                </div>
                                <div className="grid grid-cols-7 mb-2 mt-1">
                                    {['日', '一', '二', '三', '四', '五', '六'].map((d, i) => (
                                        <div key={d} className={`text-center text-[10px] font-bold ${i===0 || i===6 ? 'text-[#EDB79C]' : 'text-white/50'}`}>{d}</div>
                                    ))}
                                </div>
                                <div className="grid grid-cols-7 gap-y-3">
                                    {renderCalendar()}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center pointer-events-none">
                            <div className="absolute inset-0 bg-[#0C567D]/60 backdrop-blur-sm pointer-events-auto transition-opacity" onClick={() => setIsModalOpen(false)}></div>
                            <div className="bg-white w-full max-w-md rounded-t-[32px] sm:rounded-[32px] p-5 shadow-2xl transform transition-transform animate-in slide-in-from-bottom-10 pointer-events-auto relative max-h-[90vh] overflow-y-auto">
                                <div className="w-10 h-1 bg-gray-200 rounded-full mx-auto mb-5"></div>
                                <div className="flex justify-between items-end mb-5 border-b border-gray-100 pb-3">
                                    <div>
                                        <div className="text-[10px] font-bold text-gray-400 mb-0.5">SELECTED DATE</div>
                                        <h3 className="text-2xl font-black text-[#0C567D]">{selectedDate}</h3>
                                    </div>
                                    <div className="bg-[#EDB79C]/20 text-[#0C567D] px-2.5 py-1 rounded-full text-xs font-bold">{drinks[selectedDate]?.length || 0} 杯</div>
                                </div>

                                <div className="space-y-3 mb-6">
                                    {(drinks[selectedDate] || []).map((d, i) => (
                                        <div key={i} onClick={() => loadDrinkToEdit(i)} className={`relative flex justify-between items-center p-3.5 rounded-[20px] border-2 cursor-pointer transition-all active:scale-98 ${editIndex === i ? 'border-[#0C567D] bg-[#0C567D]/5' : 'border-gray-100 bg-white hover:border-[#EDB79C]'}`}>
                                            <div className="flex items-center gap-3">
                                                <div className="w-9 h-9 bg-[#0C567D] rounded-full flex items-center justify-center text-[#EDB79C] shadow-md flex-shrink-0"><Coffee size={16}/></div>
                                                <div className="overflow-hidden">
                                                    <div className="font-bold text-gray-800 truncate text-sm">{d.shop}</div>
                                                    <div className="text-[10px] text-gray-400 mt-0.5 flex gap-1 overflow-x-auto no-scrollbar"><span className="bg-gray-100 px-1.5 py-0.5 rounded-md whitespace-nowrap">{d.category}</span><span className="whitespace-nowrap">{d.item}</span></div>
                                                </div>
                                            </div>
                                            <div className="font-black text-base text-[#0C567D] flex-shrink-0 pl-2">${d.price}</div>
                                        </div>
                                    ))}
                                </div>

                                <div className="bg-[#FDFBF7] p-1 rounded-[28px]">
                                    <div className="bg-white p-4 rounded-[24px] shadow-sm space-y-4">
                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="space-y-1"><label className="text-[10px] font-bold text-gray-400 ml-2">店家</label><input type="text" placeholder="店家" className="w-full bg-gray-50 border-2 border-transparent hover:border-[#EDB79C] focus:border-[#0C567D] rounded-full px-3 py-2.5 text-sm font-bold outline-none transition-all text-center placeholder-gray-300" value={formData.shop} onChange={e => setFormData({...formData, shop: e.target.value})}/></div>
                                            <div className="space-y-1"><label className="text-[10px] font-bold text-gray-400 ml-2">品項</label><input type="text" placeholder="品項" className="w-full bg-gray-50 border-2 border-transparent hover:border-[#EDB79C] focus:border-[#0C567D] rounded-full px-3 py-2.5 text-sm font-bold outline-none transition-all text-center placeholder-gray-300" value={formData.item} onChange={e => setFormData({...formData, item: e.target.value})}/></div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="space-y-1 flex flex-col h-full"><label className="text-[10px] font-bold text-gray-400 ml-2">價格</label><div className="relative flex-1"><span className="absolute left-3 top-1/2 transform -translate-y-1/2 text-[#EDB79C] font-bold text-sm">$</span><input type="number" placeholder="0" className="w-full h-full bg-[#EDB79C]/10 border-2 border-transparent focus:border-[#0C567D] rounded-full py-2.5 text-center text-sm font-black text-[#0C567D] outline-none placeholder-[#EDB79C]/50 pl-5" value={formData.price} onChange={e => setFormData({...formData, price: e.target.value})}/></div></div>
                                            <div className="space-y-1 flex flex-col h-full relative"><label className="text-[10px] font-bold text-gray-400 ml-2 flex items-center gap-1"><LayoutGrid size={10}/> 飲品類別</label><div className="relative flex-1"><select className="w-full h-full appearance-none bg-[#0C567D]/5 border-2 border-transparent hover:border-[#0C567D]/20 focus:border-[#0C567D] rounded-full px-3 py-2.5 text-sm font-bold outline-none transition-all text-center text-[#0C567D]" value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})}>{CATEGORIES.map(cat => (<option key={cat} value={cat}>{cat}</option>))}</select><ChevronDown size={14} className="absolute right-3 top-1/2 transform -translate-y-1/2 text-[#0C567D] pointer-events-none"/></div></div>
                                        </div>
                                        <div className="space-y-1"><label className="text-[10px] font-bold text-gray-400 ml-2">甜度</label><div className="grid grid-cols-3 gap-2">{SUGAR_LEVELS.map(s => (<button key={s} onClick={() => setFormData({...formData, sugar: s})} className={`py-2 rounded-2xl text-[10px] font-bold border transition-all active:scale-95 ${formData.sugar === s ? 'bg-[#0C567D] text-white border-[#0C567D] shadow-md' : 'bg-white border-gray-100 text-gray-400'}`}>{s}</button>))}</div></div>
                                        <div className="space-y-1"><label className="text-[10px] font-bold text-gray-400 ml-2">冰塊</label><div className="grid grid-cols-3 gap-2">{ICE_LEVELS.map(i => (<button key={i} onClick={() => setFormData({...formData, ice: i})} className={`py-2 rounded-2xl text-[10px] font-bold border transition-all active:scale-95 ${formData.ice === i ? 'bg-[#0C567D] text-white border-[#0C567D] shadow-md' : 'bg-white border-gray-100 text-gray-400'}`}>{i}</button>))}</div></div>
                                        <div className="flex flex-col gap-3 pt-3 border-t border-gray-100">
                                            <button onClick={handleSave} className="w-full bg-[#0C567D] text-white font-black py-3.5 rounded-[20px] shadow-lg shadow-[#0C567D]/20 active:scale-95 transition-all text-base tracking-wide hover:bg-[#094260]">{editIndex !== null ? '保存修改' : '加入紀錄'}</button>
                                            {editIndex !== null && (<button type="button" onClick={(e) => handleDelete(editIndex, e)} className="w-full py-3 bg-red-50 text-red-500 rounded-[20px] font-bold hover:bg-red-100 transition-colors flex items-center justify-center gap-2 cursor-pointer active:scale-95"><Trash2 size={16}/> 刪除此紀錄</button>)}
                                        </div>
                                    </div>
                                </div>
                                {((drinks[selectedDate] || []).length === 0) && (<div className="mt-4 text-center py-5 bg-gray-50 rounded-[24px] border-2 border-dashed border-gray-200"><span className="text-gray-400 text-xs font-bold">今天還沒喝飲料 🥤</span></div>)}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<BubbleTeaTracker />);
    </script>
</body>
</html>
